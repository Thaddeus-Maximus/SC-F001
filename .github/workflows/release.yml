name: release

# Publish a firmware release when a version tag is pushed.
#
#   git tag v1.1.2 && git push origin v1.1.2
#
# The job builds the image, verifies the tag matches main/version.txt, attaches
# the .bin + latest.json to a GitHub Release, and regenerates the Pages site.
# Manual retag: `git push origin :vX.Y.Z` to delete, then re-tag and push.

on:
  push:
    tags: ['v*']

permissions:
  contents: write   # create releases
  pages: write      # deploy Pages
  id-token: write   # deploy-pages OIDC

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches main/version.txt
        id: ver
        run: |
          tag="${GITHUB_REF_NAME#v}"
          file="$(head -n1 main/version.txt | tr -d '[:space:]')"
          echo "tag=v$tag  version.txt=$file"
          if [ "$tag" != "$file" ]; then
            echo "::error::Tag v$tag does not match main/version.txt ($file). Bump version.txt and retag."
            exit 1
          fi
          echo "version=$tag" >> "$GITHUB_OUTPUT"

      - name: Build firmware (ESP-IDF v5.3.1)
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.3.1
          target: esp32
          path: '.'

      - name: Stage OTA payload + manifest
        run: |
          python3 release/gen_manifest.py \
            --version "${{ steps.ver.outputs.version }}" \
            --repo "$GITHUB_REPOSITORY" \
            --tag "$GITHUB_REF_NAME" \
            --build-dir build \
            --out dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="release/notes/${{ steps.ver.outputs.version }}.md"
          args=(--title "SC-F001 ${{ steps.ver.outputs.version }}")
          if [ -f "$notes" ]; then
            args+=(--notes-file "$notes")
          else
            args+=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" "${args[@]}" \
            "dist/SC-F001-${{ steps.ver.outputs.version }}.bin" \
            "dist/SC-F001.bin" \
            "dist/latest.json"

  pages:
    needs: build-release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate release site
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 release/gen_pages.py --repo "$GITHUB_REPOSITORY" --out site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
