name: pages

# Firmware is built and released LOCALLY (see release/release.sh); this workflow
# does NOT build or flash anything. It only regenerates the GitHub Pages index
# from the published Releases.
#
# Triggered by dispatch only — release.sh runs `gh workflow run pages.yml
# --ref main` after publishing a release. Running from main (not the release
# tag) keeps it inside the github-pages environment's default deploy policy, so
# no tag has to be whitelisted. Run it by hand from the Actions tab any time.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate release site
        env:
          GH_TOKEN: ${{ github.token }}
          # Set this repo variable to update.thestockcropper.com once DNS points
          # there; until then the site stays on the github.io URL.
          SC_PAGES_CNAME: ${{ vars.SC_PAGES_CNAME }}
        run: python3 release/gen_pages.py --repo "$GITHUB_REPOSITORY" --out site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
